meta:
  title: "Laguna S-2.1"
  slug: "laguna-s-2.1"
  provider: "Poolside"
  description: "Poolside's 118B total / 8B activated MoE coding model with mixed sliding-window + global attention, native interleaved reasoning, and 1M context — the larger sibling of Laguna XS-2.1, tuned for agentic coding."
  date_added: 2026-07-21
  date_updated: 2026-08-28
  difficulty: intermediate
  tasks:
    - text
  performance_headline: "118B/8B-A MoE for agentic coding with interleaved thinking and tool use"
  related_recipes:
    - "poolside/Laguna-XS-2.1"
    - "poolside/Laguna-M.1"
  hardware:
    h200: verified
    mi300x: verified
    mi325x: verified
    mi355x: verified

model:
  model_id: "poolside/Laguna-S-2.1"
  min_vllm_version: "0.27.1"
  docker_image:
    amd: "vllm/vllm-openai-rocm:v0.27.1"
  architecture: moe
  parameter_count: "118B"
  active_parameters: "8B"
  context_length: 1048576
  base_args:
    - "--trust-remote-code"
  base_env: {}

features:
  tool_calling:
    description: "Enable automatic tool choice with Poolside's tool-call parser"
    args:
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "poolside_v1"
  reasoning:
    description: "Enable interleaved thinking with Poolside's reasoning parser"
    args:
      - "--reasoning-parser"
      - "poolside_v1"
  spec_decoding:
    description: "DFlash speculative decoding with the Laguna-S-2.1 draft model (15 tokens, greedy)"
    args:
      - "--speculative-config"
      - '{"model":"poolside/Laguna-S-2.1-DFlash","num_speculative_tokens":15,"method":"dflash"}'
      - "--moe-backend"
      - "triton"

opt_in_features:
  - spec_decoding

variants:
  default:
    precision: bf16
    vram_minimum_gb: 282
    description: "BF16 weights (~235GB) — needs a multi-GPU node (≥2× H200/B200, or a full HGX node)"
    tp:
      mi300x: 2
      mi325x: 2
      mi355x: 2
    hardware_overrides:
      mi300x:
        extra_env:
          VLLM_ROCM_USE_AITER: "1"
          VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: "1"
          VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "INT4"
        extra_args:
          - "--attention-config"
          - '{"backend_per_kind":{"full_attention":"ROCM_ATTN","sliding_window":"ROCM_AITER_FA"}}'
      mi325x:
        extra_env:
          VLLM_ROCM_USE_AITER: "1"
          VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: "1"
          VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "INT4"
        extra_args:
          - "--attention-config"
          - '{"backend_per_kind":{"full_attention":"ROCM_ATTN","sliding_window":"ROCM_AITER_FA"}}'
      mi355x:
        extra_env:
          VLLM_ROCM_USE_AITER: "1"
          VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: "1"
          VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "INT4"
        extra_args:
          - "--attention-config"
          - '{"backend_per_kind":{"full_attention":"ROCM_AITER_UNIFIED_ATTN","sliding_window":"ROCM_AITER_FA"}}'
  fp8:
    model_id: "poolside/Laguna-S-2.1-FP8"
    precision: fp8
    vram_minimum_gb: 145
    description: "Block-FP8 weights + FP8 KV cache (~121GB) — TP2 on MI300X/MI325X/H200, TP1 on MI355X/B300"
    tp:
      mi300x: 2
      mi325x: 2
      mi355x: 1
    extra_env:
      VLLM_BLOCKSCALE_FP8_GEMM_FLASHINFER: "0"
    hardware_overrides:
      mi300x:
        extra_env:
          VLLM_ROCM_USE_AITER: "1"
          VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: "1"
          VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "INT4"
        extra_args:
          - "--attention-config"
          - '{"backend_per_kind":{"full_attention":"ROCM_ATTN","sliding_window":"ROCM_AITER_FA"}}'
      mi325x:
        extra_env:
          VLLM_ROCM_USE_AITER: "1"
          VLLM_ROCM_USE_AITER_MOE: "0"
          VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: "1"
          VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "INT4"
        extra_args:
          - "--attention-config"
          - '{"backend_per_kind":{"full_attention":"ROCM_ATTN","sliding_window":"ROCM_AITER_FA"}}'
      mi355x:
        extra_env:
          VLLM_ROCM_USE_AITER: "1"
          VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: "1"
          VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "INT4"
        extra_args:
          - "--attention-config"
          - '{"backend_per_kind":{"full_attention":"ROCM_AITER_UNIFIED_ATTN","sliding_window":"ROCM_AITER_FA"}}'
  nvfp4:
    model_id: "poolside/Laguna-S-2.1-NVFP4"
    precision: nvfp4
    vram_minimum_gb: 86
    description: "NVFP4 weights + FP8 KV cache (~72GB, Blackwell only) — fits a single B200/B300"
  int4:
    model_id: "poolside/Laguna-S-2.1-INT4"
    precision: int4
    vram_minimum_gb: 112
    description: "INT4 (W4A16) weights + FP8 KV cache (~93GB) — TP1 with full context on MI300X/MI355X"
    hardware_overrides:
      mi300x:
        extra_env:
          VLLM_ROCM_USE_AITER: "1"
          VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: "1"
          VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "INT4"
        extra_args:
          - "--attention-config"
          - '{"backend_per_kind":{"full_attention":"ROCM_ATTN","sliding_window":"ROCM_AITER_FA"}}'
      mi325x:
        extra_env:
          VLLM_ROCM_USE_AITER: "1"
          VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: "1"
          VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "INT4"
        extra_args:
          - "--attention-config"
          - '{"backend_per_kind":{"full_attention":"ROCM_ATTN","sliding_window":"ROCM_AITER_FA"}}'
      mi355x:
        extra_env:
          VLLM_ROCM_USE_AITER: "1"
          VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: "1"
          VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "INT4"
        extra_args:
          - "--attention-config"
          - '{"backend_per_kind":{"full_attention":"ROCM_AITER_UNIFIED_ATTN","sliding_window":"ROCM_AITER_FA"}}'

compatible_strategies:
  - single_node_tp
  - single_node_tep
  - single_node_dep

hardware_overrides: {}

strategy_overrides: {}

guide: |
  ## Overview

  [Laguna S-2.1](https://huggingface.co/poolside/Laguna-S-2.1) is Poolside's
  118B-total / 8B-activated Mixture-of-Experts model — the larger sibling of
  [Laguna XS-2.1](https://huggingface.co/poolside/Laguna-XS-2.1), built for
  agentic coding and long-horizon work. It shares the `laguna` architecture:
  mixed sliding-window + global attention (3:1 across 48 layers) with softplus
  per-head gating and an FP8 KV cache, plus native interleaved reasoning and
  tool calling.

  ### Key features
  - **Mixed SWA + global attention**: 36 sliding-window layers (window=512)
    interleaved with 12 global-attention layers (3:1), each with per-layer
    rotary scaling.
  - **256 experts + 1 shared expert** with top-10 routing.
  - **Grouped-query attention**: 8 KV heads, head dim 128, per-head softplus
    output gating.
  - **Native FP8 KV cache** to reduce memory per token.
  - **Interleaved reasoning**: thinking blocks emitted between tool calls;
    toggled per-request via `enable_thinking`.
  - **Tool calling**: Poolside's XML-style tool-call protocol, parsed via
    `poolside_v1`.

  Same architecture as XS-2.1, so vLLM needs no S-specific code — support
  lands with the shared `laguna` implementation.

  ## Prerequisites

  ### pip
  ```bash
  uv pip install -U 'vllm>=0.27.1'
  ```

  ### Docker
  ```bash
  docker pull vllm/vllm-openai:latest
  ```

  ## Variants and VRAM

  Laguna S-2.1 is large: the BF16 weights are ~235GB, so unlike XS-2.1 the
  default **does not fit a single GPU** — plan for a multi-GPU node or pick a
  quantized checkpoint. Select one with the **Variant** control above:

  | Variant | Checkpoint | Weights | ~Size | Fits on |
  |---------|-----------|---------|-------|---------|
  | BF16 | [Laguna-S-2.1](https://huggingface.co/poolside/Laguna-S-2.1) | BF16 | 235 GB | ≥2× H200/B200, or a full HGX node |
  | FP8 | [Laguna-S-2.1-FP8](https://huggingface.co/poolside/Laguna-S-2.1-FP8) | Block-FP8 | 121 GB | TP2 on MI300X/MI325X/H200; TP1 on MI355X/B300; set `VLLM_BLOCKSCALE_FP8_GEMM_FLASHINFER=0` |
  | NVFP4 | [Laguna-S-2.1-NVFP4](https://huggingface.co/poolside/Laguna-S-2.1-NVFP4) | NVFP4 | 72 GB | single B200/B300 (Blackwell only) |
  | INT4 | [Laguna-S-2.1-INT4](https://huggingface.co/poolside/Laguna-S-2.1-INT4) | INT4 (W4A16) | 93 GB | TP1 on MI300X/MI355X; cap context on smaller-memory GPUs |

  Quantization is detected automatically from each checkpoint's
  `quantization_config`, so the launch command is identical — just swap the
  model ID. All three quantized checkpoints ship an **FP8-quantized KV cache**.

  Precision-matched DFlash speculators ship for each quantization —
  [DFlash-FP8](https://huggingface.co/poolside/Laguna-S-2.1-DFlash-FP8),
  [DFlash-NVFP4](https://huggingface.co/poolside/Laguna-S-2.1-DFlash-NVFP4),
  [DFlash-INT4](https://huggingface.co/poolside/Laguna-S-2.1-DFlash-INT4) — to
  pair speculative decoding with a quantized base at matching precision.

  > **Context length.** The BF16, FP8, and INT4 checkpoints are configured for
  > 1,048,576 tokens. The general BF16 and H200 INT4 examples below cap context
  > at 262,144 tokens to reduce KV memory. The verified AMD commands deliberately
  > omit `--max-model-len`: BF16 uses TP2; FP8 uses TP2 on MI300X and TP1 on
  > MI355X; INT4 uses TP1 on both tested systems.

  ## Launch command

  ### Multi-GPU node (H200/B200, BF16)
  ```bash
  vllm serve poolside/Laguna-S-2.1 \
    --trust-remote-code \
    --tensor-parallel-size 8 \
    --max-model-len 262144 \
    --enable-auto-tool-choice \
    --tool-call-parser poolside_v1 \
    --reasoning-parser poolside_v1
  ```

  ### AMD ROCm — MI355X BF16, full context

  vLLM 0.27.1 can route full and sliding-window KV-cache groups to different
  attention backends. On MI355X, unified AITER is the fastest tested
  full-attention backend, while AITER FlashAttention avoids empty generations
  on Laguna's sliding-window layers. The command below was validated with the
  v0.27.1 ROCm image. TP2 is the minimum tested topology that fits the full
  1,048,576-token context at the default 0.90 GPU-memory utilization. Do not
  add `--max-model-len` when full context is required.

  ```bash
  export VLLM_ROCM_USE_AITER=1
  export VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS=1
  export VLLM_ROCM_QUICK_REDUCE_QUANTIZATION=INT4

  vllm serve poolside/Laguna-S-2.1 \
    --trust-remote-code \
    --tensor-parallel-size 2 \
    --enable-auto-tool-choice \
    --tool-call-parser poolside_v1 \
    --reasoning-parser poolside_v1 \
    --attention-config '{"backend_per_kind":{"full_attention":"ROCM_AITER_UNIFIED_ATTN","sliding_window":"ROCM_AITER_FA"}}'
  ```

  Equivalent ROCm Docker command:

  ```bash
  docker run --rm -it \
    --cap-add=SYS_PTRACE \
    --ipc=host \
    --privileged=true \
    --shm-size=128GB \
    --network=host \
    --device=/dev/kfd \
    --device=/dev/dri \
    --group-add video \
    -e VLLM_ROCM_USE_AITER=1 \
    -e VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS=1 \
    -e VLLM_ROCM_QUICK_REDUCE_QUANTIZATION=INT4 \
    vllm/vllm-openai-rocm:v0.27.1 \
      --model poolside/Laguna-S-2.1 \
      --trust-remote-code \
      --tensor-parallel-size 2 \
      --enable-auto-tool-choice \
      --tool-call-parser poolside_v1 \
      --reasoning-parser poolside_v1 \
      --attention-config '{"backend_per_kind":{"full_attention":"ROCM_AITER_UNIFIED_ATTN","sliding_window":"ROCM_AITER_FA"}}'
  ```

  On v0.27.1, a fixed prefix-off 8,192-input/1,024-output benchmark completed
  32/32 requests with exact token lengths and zero failures after an excluded
  warmup:

  | TP | Full-context fit | Output tok/s | Mean TTFT | Mean TPOT |
  |---:|---|---:|---:|---:|
  | 2 | 5.59x maximum concurrency | 1,301.16 | 2,208.81 ms | 20.66 ms |

  Earlier exact-main 8,000-input/1,024-output references measured 1,923.28
  output tok/s at TP4 and 2,448.01 at TP8. Those runs used a different runtime
  and input length, so they are topology references rather than a speedup
  comparison with the v0.27.1 TP2 result.

  TP1 failed the full-context KV-capacity gate under both tested full-attention
  backends (about 52.6 GiB required versus 30.99 GiB available). Its separate
  9,216-token diagnostic run is not full-context evidence. With the mapping
  above, v0.27.1 scored 94.31% strict and flexible exact match on all 1,319
  GSM8K prompts at 25-shot and concurrency 128, with zero empty generations.

  ### AMD ROCm — MI300X / MI325X BF16, full context

  Unified AITER full attention failed during gfx942 graph warmup, so MI300X
  uses vLLM's ROCm attention backend for full-attention layers and AITER
  FlashAttention for sliding-window layers. MI325X renders this same
  conservative BF16 mapping.

  ```bash
  export VLLM_ROCM_USE_AITER=1
  export VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS=1
  export VLLM_ROCM_QUICK_REDUCE_QUANTIZATION=INT4

  vllm serve poolside/Laguna-S-2.1 \
    --trust-remote-code \
    --tensor-parallel-size 2 \
    --enable-auto-tool-choice \
    --tool-call-parser poolside_v1 \
    --reasoning-parser poolside_v1 \
    --attention-config '{"backend_per_kind":{"full_attention":"ROCM_ATTN","sliding_window":"ROCM_AITER_FA"}}'
  ```

  With the v0.27.1 ROCm image, this configuration started at the full
  1,048,576-token context and completed an actual 1,048,000-input-token
  request plus one output token. Basic chat, reasoning separation, and
  automatic and required tool-call parsing passed. The prefix-cache validation
  also passed: the second identical prefix-enabled request reused 84,000
  prompt tokens, while the paired prefix-disabled test reported zero cache
  queries and hits. No MI300X throughput claim is made from these feature
  checks.

  ### AMD ROCm — FP8 and INT4, full context

  Select the FP8 or INT4 variant in the command builder to render the same
  hardware-specific attention mappings. With the exact v0.27.1 ROCm image,
  MI355X runs both variants at TP1. MI300X runs INT4 at TP1 and FP8 at TP2.
  Every passing configuration retained the checkpoint's full 1,048,576-token
  context, completed an actual 1,048,000-input-token request plus one output
  token, and passed chat, reasoning-parser, automatic and required tool-call,
  and default-on prefix-cache checks.

  On MI300X, FP8 TP1 is not a full-context configuration: its 122.65 GiB loaded
  model left 42.02 GiB for KV cache, below the 50.32 GiB required. TP2 provided
  a 4,295,640-token cache and 4.10x full-context concurrency. The INT4 model
  loaded in 93.54 GiB at TP1 and provided a 1,474,037-token cache with 1.41x
  full-context concurrency.

  ### AMD ROCm — MI325X FP8

  MI325X renders the MI300X TP2 attention mapping. Its override also disables
  AITER MoE because the blockscale kernel has produced corrupt logits in prior
  testing; other AITER operators remain enabled while vLLM uses Triton MoE.
  This exact quantized arm was not separately rerun on MI325X.

  ### Single GPU (INT4 on H200, or NVFP4 on B200)
  ```bash
  vllm serve poolside/Laguna-S-2.1-INT4 \
    --trust-remote-code \
    --max-model-len 262144 \
    --enable-auto-tool-choice \
    --tool-call-parser poolside_v1 \
    --reasoning-parser poolside_v1
  ```

  ## Controlling reasoning

  Reasoning is **off by default** in the chat template. Enable it per-request:

  ```python
  from openai import OpenAI
  client = OpenAI(base_url="http://localhost:8000/v1", api_key="EMPTY")

  resp = client.chat.completions.create(
      model="poolside/Laguna-S-2.1",
      messages=[{"role": "user", "content": "Write a Python retry wrapper with exponential backoff."}],
      extra_body={"chat_template_kwargs": {"enable_thinking": True}},
      temperature=0.7,
      top_p=1.0,
      extra_query={"top_k": 20},
  )
  print(resp.choices[0].message.reasoning_content)
  print(resp.choices[0].message.content)
  ```

  Or default-on with `--default-chat-template-kwargs '{"enable_thinking": true}'`.

  The model's `generation_config.json` sets `top_k 20` (eval-certified
  truncation) so clients that send no sampling params still get sane output.
  Do **not** add `min_p` when speculative decoding is on — vLLM rejects
  `min_p`/`logit_bias` with speculation; use `top_k`/`top_p`.

  ## Speculative decoding (DFlash)

  Enable the **Spec Decoding** toggle above to attach Poolside's
  [DFlash draft model](https://huggingface.co/poolside/Laguna-S-2.1-DFlash) — a
  parallel drafter that proposes up to 15 draft tokens per step. Measured mean
  accepted length is ~3.1 tokens/step on natural text (higher on code),
  matching Poolside's production deployment.

  Requires:
  - DFlash drafter support for Laguna, merged in
    [PR #46853](https://github.com/vllm-project/vllm/pull/46853) (2026-07-03) —
    use a vLLM build that includes it (validated on 0.25.1).
  - `--moe-backend triton` — the default DeepGEMM MoE backend is incompatible
    with the DFlash draft path. Enabling the toggle adds this flag.

  ```bash
  vllm serve poolside/Laguna-S-2.1 \
    --trust-remote-code \
    --tensor-parallel-size 8 \
    --max-model-len 16384 \
    --enable-auto-tool-choice \
    --tool-call-parser poolside_v1 \
    --reasoning-parser poolside_v1 \
    --speculative-config '{"model":"poolside/Laguna-S-2.1-DFlash","num_speculative_tokens":15,"method":"dflash"}' \
    --moe-backend triton
  ```

  ### DGX Spark (GB10)

  The NVFP4 checkpoint is validated on a single DGX Spark (GB10, `sm_121a`) with
  vLLM 0.25.1 + a FlashInfer nightly and DFlash — see the
  [Laguna-S-2.1-NVFP4 model card](https://huggingface.co/poolside/Laguna-S-2.1-NVFP4)
  for the full one-box recipe.

  ## References

  - [Model card](https://huggingface.co/poolside/Laguna-S-2.1)
  - [DFlash draft model](https://huggingface.co/poolside/Laguna-S-2.1-DFlash)
  - [vLLM DFlash spec-decoding PR #46853](https://github.com/vllm-project/vllm/pull/46853)
  - [Laguna XS-2.1 recipe](https://huggingface.co/poolside/Laguna-XS-2.1)
